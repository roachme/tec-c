# Fixture config for tests/memleak/memcheck.
#
# Deliberately isolated from any real user config: the memcheck script
# always passes '-f' pointing here, so results don't depend on whatever
# happens to live in $HOME/.config/tec/tec.cfg on the machine running the
# tests (CI has none; a dev box may have hooks pointing at real plugins
# like gmux, which would make memcheck's outcome depend on what's
# installed rather than on tec's own memory behavior).
#
# 'hook' stays false even though the script also passes '-H off': the
# '-H' CLI flag always wins, this is just belt-and-braces so the fixture
# is self-consistent if ever run without it.
options = {
    hook = false;
    color = false;
    debug = false;
};

# Exercises the alias-dispatch path (cli/alias.c), which nothing else
# covers: 'dir' resolves to a builtin, 'dtool' resolves to a plugin
# (chains into the pgn dispatch below), 'broken' resolves to a name that
# is neither a builtin nor a plugin.
alias = {
    dir = "ls";
    dtool = "dummy cat";
    broken = "nosuchcmd";
};
